name: Deploy Supabase Edge Functions

# supabase/functions 아래가 바뀌어 main 에 머지되면 모든 함수를 Supabase 에 배포합니다.
# 처음 한 번 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_ACCESS_TOKEN 을 넣어야 합니다.
# (https://supabase.com/dashboard/account/tokens 에서 발급)

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: aiwqfqfswuehxqferrpn
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::저장소 Secrets 에 SUPABASE_ACCESS_TOKEN 을 먼저 넣어 주세요."
            exit 1
          fi
      # _shared 처럼 밑줄로 시작하는 폴더는 공용 코드라 배포하지 않습니다
      - name: Deploy
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac
            echo "▶ $name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID" --use-api
          done
