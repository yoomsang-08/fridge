name: Deploy Supabase Edge Functions

# supabase/functions 아래가 바뀌어 main 에 머지되면 모든 함수를 Supabase 에 배포합니다.
# 처음 한 번 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_ACCESS_TOKEN 을 넣어야 합니다.
# (https://supabase.com/dashboard/account/tokens 에서 발급)
# 식품 검색(food-search)용 FOODSAFETY_API_KEY 도 Secret 에 넣으면 함수 Secret 으로 함께 설정합니다.
# 푸시 알림용 VAPID_PRIVATE_KEY, 아침 알림 호출 확인용 CRON_SECRET 도 같은 방식입니다.
# 함수 폴더에 .no-verify-jwt 파일이 있으면 로그인 토큰 확인 없이 배포합니다(함수가 직접 확인).

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: aiwqfqfswuehxqferrpn
      FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # 공개키라 저장소에 있어도 됩니다. 앱(deploy.yml)의 VITE_VAPID_PUBLIC_KEY 와 같아야 합니다
      VAPID_PUBLIC_KEY: BPEuN0N0mamPuhkTbTLnX8LCIKnCilGMHIUb27_aeAnhw7P_grlJXGh4cWUJURZ4gA7R1iSWM5DeOHUbJ7YPDB4
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::저장소 Secrets 에 SUPABASE_ACCESS_TOKEN 을 먼저 넣어 주세요."
            exit 1
          fi
      # 함수가 쓰는 비밀값: GitHub Secret 에 있으면 Supabase 함수 Secret 으로 옮긴다
      - name: Sync function secrets
        run: |
          for key in FOODSAFETY_API_KEY VAPID_PRIVATE_KEY CRON_SECRET; do
            if [ -n "${!key}" ]; then
              supabase secrets set "$key=${!key}" --project-ref "$SUPABASE_PROJECT_ID"
            else
              echo "$key 없음: 건너뜀"
            fi
          done
          supabase secrets set VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" --project-ref "$SUPABASE_PROJECT_ID"
      # _shared 처럼 밑줄로 시작하는 폴더는 공용 코드라 배포하지 않습니다
      - name: Deploy
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac
            flags=""
            [ -f "$dir.no-verify-jwt" ] && flags="--no-verify-jwt"
            echo "▶ $name $flags"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID" --use-api $flags
          done
