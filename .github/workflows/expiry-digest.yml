name: Morning expiry digest

# 아침 알림 시험용 수동 실행. 매시 예약 실행은 Supabase 예약 작업(pg_cron, 0009_hardening.sql)이 합니다.
# (GitHub 예약 실행은 늦거나 건너뛰고, 60일간 저장소 변경이 없으면 멈춰서 옮겼습니다)
# all 을 켜면 시각과 상관없이 알림 켠 기기 모두에게 보냅니다.
# 호출 확인값 CRON_SECRET 은 supabase-functions 워크플로와 같은 방식으로 SUPABASE_ACCESS_TOKEN 에서 만듭니다.
# 토큰을 바꿨다면 supabase-functions 워크플로를 한 번 다시 실행해 함수 쪽 값도 맞춰 주세요.
on:
  workflow_dispatch:
    inputs:
      all:
        description: '시각과 상관없이 알림 켠 기기 모두에게 보내기'
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call expiry-digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALL: ${{ inputs.all == true }}
        run: |
          if [ -z "$CRON_SECRET" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::저장소 Secrets 에 SUPABASE_ACCESS_TOKEN 을 먼저 넣어 주세요."
            exit 1
          fi
          CRON_SECRET="${CRON_SECRET:-$(printf 'fridge-cron:%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -d' ' -f1)}"
          echo "::add-mask::$CRON_SECRET"
          curl -fsS -X POST https://aiwqfqfswuehxqferrpn.supabase.co/functions/v1/expiry-digest \
            -H "x-cron-secret: $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"all\": $ALL}"
