name: Morning expiry digest

# 매시 5분쯤 실행해, 설정에서 그 시각을 고른 기기에 기한 임박 알림을 보냅니다.
# GitHub 예약 실행은 몇 분~수십 분 늦을 수 있어요. 직접 실행할 때 all 을 켜면 시각과 상관없이 모두에게 보냅니다(시험용).
# 저장소 Secret CRON_SECRET 이 Supabase 함수 Secret 과 같아야 합니다(supabase-functions 워크플로가 옮김).
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      all:
        description: '시각과 상관없이 알림 켠 기기 모두에게 보내기'
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call expiry-digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALL: ${{ inputs.all == true }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::저장소 Secrets 에 CRON_SECRET 을 먼저 넣어 주세요."
            exit 1
          fi
          curl -fsS -X POST https://aiwqfqfswuehxqferrpn.supabase.co/functions/v1/expiry-digest \
            -H "x-cron-secret: $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{\"all\": $ALL}"
